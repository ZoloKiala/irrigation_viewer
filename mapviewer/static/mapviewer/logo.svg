<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Irrigation Viewer logo">
  <defs>
    <!-- Brand gradient (matches the iv-grad-droplet design token) -->
    <linearGradient id="ivg-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="55%"  stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Soft inner glow -->
    <radialGradient id="ivg-glow" cx="38%" cy="32%" r="65%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square chip — squircle-ish, modern app-icon shape -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16"
        fill="url(#ivg-bg)"/>
  <!-- Inner glow over the chip -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16"
        fill="url(#ivg-glow)"/>

  <!-- Subtle pivot crop-rotation arcs (very faint) — gives the satellite feel -->
  <g stroke="#ffffff" stroke-width=".75" fill="none" opacity=".18">
    <circle cx="32" cy="38" r="22"/>
    <circle cx="32" cy="38" r="14"/>
  </g>

  <!-- White water-drop silhouette, dominant at all sizes -->
  <path d="M32 12
           C 24 24, 18 31, 18 39
           A 14 14 0 1 0 46 39
           C 46 31, 40 24, 32 12 Z"
        fill="#ffffff"/>

  <!-- Tiny inner shimmer on the droplet for depth -->
  <ellipse cx="27" cy="34" rx="3" ry="5"
           fill="#ffffff" opacity=".55"
           transform="rotate(-25 27 34)"/>
</svg>
